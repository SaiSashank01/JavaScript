<!doctype html>
<html lang="en">
  <head>
    <title>Concate</title>
    <script>
      function onClickSubmit() {
        Name = document.getElementById("txtName").value;
        Age = document.getElementById("numberAge").value;
        Skills = document.getElementById("txtSkills").value;

        alert("My Name is :" + Name + ","+" Age is: " + Age + ","+ " Skills are: " + Skills +".");
        alert(`My Name is :${Name}, Age is: ${Age}, Skills are: ${Skills}. `)
      }
    </script>
  </head>
  <body>
    <h1>Concatation of String</h1>
    <form>
      <label for="txtName">Name: </label>
      <input type="txt" id="txtName" /><br />

      <label for="numberAge">Age:</label>
      <input type="number" id="numberAge" style="margin: 8px" /><br />

      <label for="txtSkills">Skills: </label>
      <input type="txt" id="txtSkills" style="margin: 8px" /><br />

      <button id="btnSubmit" onclick="onClickSubmit()">Submit</button>
    </form>
  </body>
</html>
