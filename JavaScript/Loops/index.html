<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loops Concept</title>
  </head>
  <body>
    <script src="marksUsingFor.js"></script>
    <label for="telNum">Enter the Telugu Marks :</label>
    <input type="number" id="telNum" text="Number" /><br /><br />
    <label for="HinNum">Enter the Hindi Marks :</label>
    <input type="number" id="HinNum" text="Number" /><br /><br />
    <label for="EngNum">Enter the English Marks :</label>
    <input type="number" id="EngNum" text="Number" /><br /><br />
    <label for="mathNum">Enter the Maths Marks :</label>
    <input type="number" id="mathNum" text="Number" /><br /><br />
    <label for="sciNum">Enter the Science Marks :</label>
    <input type="number" id="sciNum" text="Number" /><br /><br />
    <label for="socNum">Enter the Social Marks :</label>
    <input type="number" id="socNum" text="Number" /><br /><br />

    <button onclick="onClickbtnSubs()" id="btn">Check</button>

    <h3>Results</h3>
    <label>Telugu : </label>
    <p id="telugugrades"></p>
    <br />
    <label>Hindi : </label>
    <p id="hindigrades"></p>
    <br />
    <label>English : </label>
    <p id="englishgrades"></p>
    <br />
    <label>Maths : </label>
    <p id="mathgrades"></p>
    <br />
    <label>Science : </label>
    <p id="scincegrades"></p>
    <br />
    <label>Social : </label>
    <p id="socialgrades"></p>
    <br />
    <label>Final Result: </label>
    <p id="finalresult"></p>
  </body>
</html>
