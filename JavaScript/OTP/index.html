<!doctype html>
<html lang="en">
  <head>
    <title>OTP Generating</title>
    <script>
      function onClickCheck() {
        const digits = Number(document.getElementById("txtDigits").value);

        if (!Number.isInteger(digits) || digits <= 0) {
          alert("Please enter a valid positive number of digits.");
          return;
        }

        const otp = String(Math.floor(Math.random() * Math.pow(10, digits))).padStart(digits, "0");
        alert("The Random number: " + otp);
      }
    </script>
  </head>
  <body>
    <h1>Generating the OTP values</h1>
    <label for="txtDigits">Digits:</label>
    <input id="txtDigits" type="number" min="1" placeholder="Enter digits" />
    <button id="btnCheck" onclick="onClickCheck()">Check</button>
  </body>
</html>
