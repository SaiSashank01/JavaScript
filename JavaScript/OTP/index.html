<!doctype html>
<html lang="en">
  <head>
    <title>OTP Generating</title>
    <script>
      function onClickCheck() {
        digits = Number(document.getElementById("txtDigits").value);
        alert("The Random number: " +Math.trunc(Math.random() * Math.pow(10, digits)),);
      }
    </script>
  </head>
  <body>
    <h1>Generating the OTP values</h1>
    <label for="txtDigits">Digits:</label>
    <input id="txtDigits" type="text" />
    <button id="btnCheck" onclick="onClickCheck()">Check</button>
  </body>
</html>
