<!doctype html>
<html lang="en">
  <head>
    <title>Sign And Absolute Methods</title>
  </head>
  <body>
    <h1>Sign and Absolute Methods</h1>
    <script>
      function onClickSign() {
        inputValue = document.getElementById("txtInputValue").value;
        alert("The Sign Value is: " + Math.sign(inputValue));
      }
      function onClickAbs() {
        inputValue = document.getElementById("txtInputValue").value;
        alert("The Absolute Value is: " + Math.abs(inputValue));
      }
    </script>
    <label for="txtInputValue">Input Value:</label>
    <input type="text" id="txtInputValue" />
    <button onclick="onClickSign()" id="btnSign">Sign</button>
    <button onclick="onClickAbs()" id="btnAbs">Abs</button>
  </body>
</html>
