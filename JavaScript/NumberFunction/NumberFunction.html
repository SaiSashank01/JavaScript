<!doctype html>
<html lang="en">
  <head>
    <title>NumberFunctions</title>
    <script>
      function onClickBtnNumber() {
        var input = Number(document.getElementById("txtInput").value);
        document.getElementById("pResult").innerHTML = input;
      }
      function onClickBtnFloat() {
        var input = parseFloat(document.getElementById("txtInput").value);
        document.getElementById("pResult").innerHTML = input;
      }
      function onClickBtnparInt() {
        var input = parseInt(document.getElementById("txtInput").value);
        document.getElementById("pResult").innerHTML = input;
      }
    </script>
  </head>
  <body>
    <h1>Typecasting:)</h1>
    <label for="txtBoxOne">Input :-</label>
    <input type="text" id="txtInput" placeholder="Enter your input value" />
    <p id="pResult"></p>
    <button id="btnNumber" onclick="onClickBtnNumber()">Number</button>
    <button id="btnInt" onclick="onClickBtnparInt()">parseInt</button>
    <button id="btnFloat" onclick="onClickBtnFloat()">parseFloat</button>
  </body>
</html>
